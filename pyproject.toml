[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcompress"
version = "0.1.0"
description = "Physics-informed 3D compression and viability screening for QM9 molecules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ISEF Virtual Molecular Screening Project" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "plotly>=5.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.60"]
notebook = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29"]

[project.scripts]
molcompress-evaluate = "molcompress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
